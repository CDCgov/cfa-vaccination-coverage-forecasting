name: Run pytest

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Test
        run: |
          uv sync --only-dev --frozen
          uv run pytest -v
